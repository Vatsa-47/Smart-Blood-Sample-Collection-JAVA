# ==============================================================================
# SmartLabTrack Backend Configuration - MySQL
# ==============================================================================
server.port=8080
spring.application.name=SmartLabTrack-Backend

# ------------------------------------------------------------------------------
# 1. PRIMARY DATABASE: MySQL Database Configuration
# Database name: smartlabtrack (Auto-creates database if not present)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/smartlabtrack?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Appanna@123
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA / Hibernate for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Spring Security & Serialization
spring.jackson.serialization.write-dates-as-timestamps=false
